<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="100%" height="100%" style="background:#0b132b; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="tbl-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <filter id="shadow-erd" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title Banner -->
  <text x="550" y="45" text-anchor="middle" fill="#6fffe9" font-size="22" font-weight="800">SecureShop Relational Database Schema &amp; Entity Relationships</text>
  <text x="550" y="70" text-anchor="middle" fill="#8d99ae" font-size="13">PostgreSQL on Supabase Cloud (aws-1-eu-west-1.pooler.supabase.com)</text>

  <!-- TABLE 1: USERS -->
  <g transform="translate(60, 110)" filter="url(#shadow-erd)">
    <rect x="0" y="0" width="280" height="340" rx="8" fill="#1c2541" stroke="#48cae4" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="36" rx="8" fill="url(#tbl-header)"/>
    <text x="14" y="24" fill="#6fffe9" font-size="14" font-weight="800">public.users</text>
    <text x="260" y="24" text-anchor="end" fill="#90e0ef" font-size="11">TABLE</text>
    
    <g transform="translate(14, 55)" font-size="11" fill="#e0e1dd">
      <text y="0"><tspan fill="#ffd166" font-weight="700">PK</tspan>  id : text</text>
      <text y="22"><tspan fill="#06d6a0" font-weight="700">UQ</tspan> email : text</text>
      <text y="44">    name : text</text>
      <text y="66">    password_hash : text</text>
      <text y="88">    salt : text</text>
      <text y="110">    role : text ('user' | 'admin')</text>
      <text y="132">    is_confirmed : boolean</text>
      <text y="154">    confirmation_code : text</text>
      <text y="176">    store_credit : numeric</text>
      <text y="198">    phone : text</text>
      <text y="220">    city / address / governorate : text</text>
      <text y="242">    failed_attempts : integer</text>
      <text y="264">    is_locked : boolean</text>
      <text y="286"><tspan fill="#8d99ae">created_at : timestamptz</tspan></text>
    </g>
  </g>

  <!-- TABLE 2: ORDERS -->
  <g transform="translate(410, 110)" filter="url(#shadow-erd)">
    <rect x="0" y="0" width="310" height="390" rx="8" fill="#1c2541" stroke="#00b4d8" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="36" rx="8" fill="url(#tbl-header)"/>
    <text x="14" y="24" fill="#90e0ef" font-size="14" font-weight="800">public.orders</text>
    <text x="290" y="24" text-anchor="end" fill="#caf0f8" font-size="11">TABLE</text>

    <g transform="translate(14, 55)" font-size="11" fill="#e0e1dd">
      <text y="0"><tspan fill="#ffd166" font-weight="700">PK</tspan>  id : text</text>
      <text y="22"><tspan fill="#06d6a0" font-weight="700">UQ</tspan> order_number : text</text>
      <text y="44"><tspan fill="#ef476f" font-weight="700">FK</tspan>  user_id : text → users.id</text>
      <text y="66">    customer_name : text</text>
      <text y="88">    customer_phone : text</text>
      <text y="110">    governorate_id / name : text</text>
      <text y="132">    city / address : text</text>
      <text y="154">    items : jsonb (OrderItem[])</text>
      <text y="176">    subtotal : numeric</text>
      <text y="198">    shipping_cost : numeric (0 EGP)</text>
      <text y="220">    coupon_discount : numeric</text>
      <text y="242">    total_amount : numeric</text>
      <text y="264">    taager_cost : numeric</text>
      <text y="286">    net_profit : numeric</text>
      <text y="308">    status : text ('pending'...'delivered')</text>
      <text y="330"><tspan fill="#8d99ae">created_at : timestamptz</tspan></text>
    </g>
  </g>

  <!-- TABLE 3: PRODUCTS -->
  <g transform="translate(780, 110)" filter="url(#shadow-erd)">
    <rect x="0" y="0" width="270" height="380" rx="8" fill="#1c2541" stroke="#0077b6" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="36" rx="8" fill="url(#tbl-header)"/>
    <text x="14" y="24" fill="#00b4d8" font-size="14" font-weight="800">public.products</text>
    <text x="250" y="24" text-anchor="end" fill="#90e0ef" font-size="11">TABLE</text>

    <g transform="translate(14, 55)" font-size="11" fill="#e0e1dd">
      <text y="0"><tspan fill="#ffd166" font-weight="700">PK</tspan>  id : text</text>
      <text y="22">    title_ar / title_en : text</text>
      <text y="44">    description_ar / en : text</text>
      <text y="66">    category / category_ar : text</text>
      <text y="88">    taager_price : numeric</text>
      <text y="110">    selling_price : numeric</text>
      <text y="132">    original_price : numeric</text>
      <text y="154">    stock : integer</text>
      <text y="176">    images : jsonb (string[])</text>
      <text y="198">    features : jsonb (string[])</text>
      <text y="220">    specifications : jsonb</text>
      <text y="242">    rating : numeric</text>
      <text y="264">    reviews_count : integer</text>
      <text y="286">    is_active : boolean</text>
      <text y="308">    is_deal / is_featured : boolean</text>
      <text y="330"><tspan fill="#8d99ae">created_at : timestamptz</tspan></text>
    </g>
  </g>

  <!-- TABLE 4: COUPONS -->
  <g transform="translate(60, 520)" filter="url(#shadow-erd)">
    <rect x="0" y="0" width="310" height="230" rx="8" fill="#1c2541" stroke="#7209b7" stroke-width="1.5"/>
    <rect x="0" y="0" width="310" height="36" rx="8" fill="url(#tbl-header)"/>
    <text x="14" y="24" fill="#c77dff" font-size="14" font-weight="800">public.coupons</text>
    <text x="290" y="24" text-anchor="end" fill="#e0aaff" font-size="11">TABLE</text>

    <g transform="translate(14, 55)" font-size="11" fill="#e0e1dd">
      <text y="0"><tspan fill="#ffd166" font-weight="700">PK</tspan>  id : text</text>
      <text y="22"><tspan fill="#06d6a0" font-weight="700">UQ</tspan> code : text ('WELCOME15', 'SECURE10')</text>
      <text y="44">    discount_percent : numeric</text>
      <text y="66">    max_discount : numeric</text>
      <text y="88">    min_order_amount : numeric</text>
      <text y="110">    expiry_date : timestamptz</text>
      <text y="132"><tspan fill="#ef476f" font-weight="700">REF</tspan> used_by_users : jsonb (userId[])</text>
      <text y="154">    is_single_use_per_user : boolean</text>
      <text y="176">    is_active : boolean</text>
    </g>
  </g>

  <!-- TABLE 5: SECURITY_LOGS -->
  <g transform="translate(450, 530)" filter="url(#shadow-erd)">
    <rect x="0" y="0" width="340" height="210" rx="8" fill="#1c2541" stroke="#f72585" stroke-width="1.5"/>
    <rect x="0" y="0" width="340" height="36" rx="8" fill="url(#tbl-header)"/>
    <text x="14" y="24" fill="#f72585" font-size="14" font-weight="800">public.security_logs</text>
    <text x="320" y="24" text-anchor="end" fill="#ffb3c6" font-size="11">TABLE</text>

    <g transform="translate(14, 55)" font-size="11" fill="#e0e1dd">
      <text y="0"><tspan fill="#ffd166" font-weight="700">PK</tspan>  id : text</text>
      <text y="22">    attack_type : text ('XSS', 'SQLi', 'IDOR', ...)</text>
      <text y="44">    payload : text (intercepted input payload)</text>
      <text y="66">    blocked : boolean (defense enforcement outcome)</text>
      <text y="88">    details : text (audit rationale)</text>
      <text y="110"><tspan fill="#ef476f" font-weight="700">FK</tspan>  user_id : text (optional)</text>
      <text y="132"><tspan fill="#8d99ae">created_at : timestamptz</tspan></text>
    </g>
  </g>

  <!-- RELATIONSHIP CONNECTORS -->
  <!-- Users to Orders (1 : N) -->
  <path d="M 340 230 L 410 230" fill="none" stroke="#48cae4" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="345" cy="230" r="4" fill="#48cae4"/>
  <polygon points="405,226 415,230 405,234" fill="#48cae4"/>
  <text x="375" y="222" fill="#90e0ef" font-size="10" text-anchor="middle">1 : N</text>

  <!-- Products to Orders (Embedded JSONB Reference) -->
  <path d="M 780 260 L 720 260" fill="none" stroke="#0077b6" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="775" cy="260" r="4" fill="#0077b6"/>
  <polygon points="725,256 715,260 725,264" fill="#0077b6"/>
  <text x="750" y="252" fill="#90e0ef" font-size="10" text-anchor="middle">N : M (jsonb)</text>

  <!-- Users to Coupons (Anti-Replay array) -->
  <path d="M 200 450 L 200 520" fill="none" stroke="#7209b7" stroke-width="2" stroke-dasharray="4 2"/>
  <polygon points="196,515 200,525 204,515" fill="#7209b7"/>
  <text x="215" y="490" fill="#c77dff" font-size="10">used_by (1:N)</text>

  <!-- Users to Security Logs -->
  <path d="M 340 370 L 450 560" fill="none" stroke="#f72585" stroke-width="1.5" stroke-dasharray="4 2"/>
  <polygon points="445,555 455,565 448,568" fill="#f72585"/>
  <text x="405" y="465" fill="#f72585" font-size="10">user_id (0:N)</text>
</svg>